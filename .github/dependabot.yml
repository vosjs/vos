# The actions in .github/workflows are pinned to commits (a floating tag is
# whatever its owner's account pushes next); this is what moves the pins.
# One grouped pull request a week, so a bump is a review and not a stream.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    ignore:
      # The v2 action needs Changesets CLI v3 and renamed inputs: moved by
      # hand, together with the CLI, never by a weekly bump.
      - dependency-name: changesets/action
        update-types: ['version-update:semver-major']
