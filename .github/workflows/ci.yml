name: CI

on:
  push:
    branches: [main]
  # On the Version Packages PR this run is held for approval, because the
  # Release workflow's own token opened the PR; that workflow approves it (see
  # the header of release.yml). Only this pull_request run counts toward the
  # PR's required checks, so there is no dispatch trigger here.
  pull_request:

# A check reads the tree and writes nothing: the token it runs with can do
# no more than that, whatever a dependency's install script or a test tries.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      # Every action is pinned to a commit, with its version beside it;
      # Dependabot moves the pins (.github/dependabot.yml). A floating tag
      # is whatever its owner's account pushes next.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Install scripts run only for the packages package.json allows
      # (pnpm.onlyBuiltDependencies); every other dependency is files.
      - run: pnpm install --frozen-lockfile
      # Formatting is checked FIRST: it needs no build, it is the cheapest
      # gate, and nothing enforcing it is how eleven files drifted out of
      # style on main without anyone noticing.
      - run: pnpm check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
