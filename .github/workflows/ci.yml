name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow dispatches this one on the Version Packages PR's
  # branch, because GitHub starts no pull_request run for a PR made with
  # GITHUB_TOKEN. Nothing here reads the event, so a dispatched run checks the
  # branch head exactly as a pull_request run would.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Formatting is checked FIRST: it needs no build, it is the cheapest
      # gate, and nothing enforcing it is how eleven files drifted out of
      # style on main without anyone noticing.
      - run: pnpm check
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
